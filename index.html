<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Napište krátký text a zobrazte ho přes celou obrazovku. Zdarma, bez registrace a také offline.">
  <meta name="theme-color" content="#111827">
  <title>MegaText – text přes celou obrazovku</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar" id="toolbar">
    <div class="toolbar__inner">
      <label class="size-control" for="sizeInput">
        <span>Velikost</span>
        <input id="sizeInput" type="range" min="48" max="320" value="220">
      </label>
      <button class="button button--secondary" id="themeButton" type="button">Světlý režim</button>
      <button class="button button--secondary" id="clearButton" type="button">Vymazat</button>
      <button class="button" id="fullscreenButton" type="button">Celá obrazovka</button>
    </div>
  </header>

  <button class="settings-button" id="settingsButton" type="button" aria-controls="toolbar" aria-expanded="false">
    <span class="sr-only">Zobrazit nastavení</span>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 15.25A3.25 3.25 0 1 0 12 8.75a3.25 3.25 0 0 0 0 6.5Zm8.4-1.5-1.76-1.02c.04-.48.04-.98 0-1.46l1.76-1.02a.75.75 0 0 0 .3-.96l-1.5-2.6a.75.75 0 0 0-.98-.3l-1.77 1.02a7.1 7.1 0 0 0-1.27-.73V4.65a.75.75 0 0 0-.75-.75h-3a.75.75 0 0 0-.75.75v2.03c-.45.2-.88.45-1.27.73L7.64 6.39a.75.75 0 0 0-.98.3l-1.5 2.6a.75.75 0 0 0 .3.96l1.76 1.02a8.7 8.7 0 0 0 0 1.46l-1.76 1.02a.75.75 0 0 0-.3.96l1.5 2.6a.75.75 0 0 0 .98.3l1.77-1.02c.4.29.82.53 1.27.73v2.03c0 .41.34.75.75.75h3c.41 0 .75-.34.75-.75v-2.03c.45-.2.88-.44 1.27-.73l1.77 1.02a.75.75 0 0 0 .98-.3l1.5-2.6a.75.75 0 0 0-.3-.96Z"/>
    </svg>
  </button>

  <main class="display" id="display">
    <label class="sr-only" for="message">Text, který chcete zobrazit</label>
    <textarea id="message" class="message" rows="1" wrap="off" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Napište text…" autofocus></textarea>
  </main>

  <footer class="footer">
    <span>MegaText.cz</span><span aria-hidden="true">·</span>
    <a href="about.html">O aplikaci a nápověda</a>
    <span aria-hidden="true">·</span>
    <a href="https://manena.info/podporit">Podpořit provoz</a>
  </footer>
  <script src="app.js" defer></script>
</body>
</html>
