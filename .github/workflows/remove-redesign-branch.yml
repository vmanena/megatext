name: Remove merged redesign branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-redesign-branch.yml

permissions:
  contents: write

jobs:
  remove-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete redesign/megatext-2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --request DELETE \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/redesign/megatext-2"
