name: Create MegaText 2.0 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-release-2.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          MegaText 2.0 je kompletně přepracovaná verze jednoduchého nástroje pro zobrazení krátkého textu přes celou obrazovku.

          ## Co je nové

          - nové jednoduché a přehledné rozhraní;
          - automatické přizpůsobení velikosti textu obrazovce;
          - zachování ručně vložených řádků;
          - světlý a tmavý režim;
          - režim celé obrazovky na počítači i mobilu;
          - offline provoz po prvním načtení;
          - žádný účet, analytika ani externí knihovny;
          - text se po zavření karty neuchovává.

          MegaText můžete používat na [MegaText.cz](https://megatext.cz).

          ❤️ Pokud vám nástroj dává smysl, můžete [podpořit jeho provoz a další vývoj](https://manena.info/podporit/).
          NOTES

          gh release create "2.0" \
            --repo "${{ github.repository }}" \
            --target "bea21c4beab38b1cff74eda844cdbfea4fcd9000" \
            --title "MegaText 2.0" \
            --notes-file release-notes.md
