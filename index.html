<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Napište krátký text a zobrazte ho přes celou obrazovku. Zdarma, bez registrace a také offline.">
  <meta name="theme-color" content="#111827">
  <title>MegaText – text přes celou obrazovku</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar" id="toolbar">
    <div class="toolbar__inner">
      <label class="size-control" for="sizeInput">
        <span>Velikost</span>
        <input id="sizeInput" type="range" min="48" max="320" value="220">
      </label>
      <button class="button button--secondary" id="themeButton" type="button">Světlý režim</button>
      <button class="button button--secondary" id="clearButton" type="button">Vymazat</button>
      <button class="button" id="fullscreenButton" type="button">Celá obrazovka</button>
    </div>
  </header>

  <button class="settings-button" id="settingsButton" type="button" aria-controls="toolbar" aria-expanded="false">
    <span class="sr-only">Zobrazit nastavení</span>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.09a2 2 0 0 1 1 1.74v.5a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </button>

  <main class="display" id="display">
    <label class="sr-only" for="message">Text, který chcete zobrazit</label>
    <textarea id="message" class="message" rows="1" wrap="off" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Napište text…" autofocus></textarea>
  </main>

  <footer class="footer">
    <span>MegaText.cz</span><span aria-hidden="true">·</span>
    <a href="about.html">O aplikaci a nápověda</a>
    <span aria-hidden="true">·</span>
    <a href="https://manena.info/podporit/" target="_blank" rel="noopener noreferrer">Podpořit provoz</a>
  </footer>
  <script src="app.js" defer></script>
</body>
</html>
